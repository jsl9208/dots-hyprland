# You can put custom rules here
# Window/layer rules: https://wiki.hyprland.org/Configuring/Window-Rules/
# Workspace rules: https://wiki.hyprland.org/Configuring/Workspace-Rules/

# Fcitx5 config
windowrule = float,class:^(org\.fcitx\.fcitx5-config-qt)$
windowrule = rounding 0,title:^(Fcitx5 Input Window)$

# gnome settings
windowrule = float,class:^(org\.gnome\.Settings)$
windowrule = size 60% 60%,class:^(org\.gnome\.Settings)$

# Kitty
windowrule = opacity 1.0 override 0.8 override,class:^(kitty)$ 
# windowrule = opacity 1.0 override 0.8 override 0.9 override, ^(kitty)$ # set opacity to 1.0 active, 0.5 inactive and 0.8 fullscreen for kitty
# windowrulev2 = immediate, class:^(kitty)$

# WeChat
windowrule = workspace 7,class:^(wechat)$
# windowrule = forceinput,title:^(微信)$
windowrule = float,workspace:7
windowrule = center 1,class:^(wechat)$
windowrule = move cursor,title:(wechat),class:(wechat)
windowrule = noblur,title:(wechat),class:(wechat)
windowrule = noborder,title:(wechat),class:(wechat)

# Feishu
windowrule = workspace 8,class:^(Feishu)$
windowrule = float,workspace:8
# windowrulev2 = tile, title:^(飞书)$, class:^(Feishu)$
windowrule = center 1,workspace:8,class:^(Feishu)$
# windowrulev2 = center 1,workspace:8,class:^(Meeting)$
windowrule = center 1,workspace:8,class:^(Xdg)
windowrule = size 60% 60%,title:^(打开文件)$,class:^(Feishu)$
windowrule = center,title:^(打开文件)$,class:^(Feishu)$
windowrule = center,title:^(Open Files)$,class:^(Feishu)$

# QQ music
windowrule = float,class:^(qqmusic)$
windowrule = size 80% 80%,class:^(qqmusic)$
windowrule = center 1,class:^(qqmusic)$

# Clash for Windows
windowrule = float,class:^(Clash for Windows)$
windowrule = center 1,class:^(Clash for Windows)$

# Steam
# windowrule = float,title:^(Steam)$
windowrule = center 1,title:^(Steam)$
windowrule = center 1,title:^(steam)$
windowrule = center 1,class:^(dota2)$

workspace = special:scratchpad, on-created-empty:kitty
